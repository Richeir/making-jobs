<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 程序员求职必要能力清单 · 可视化</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface2:#fbfbfc; --text:#15171c; --muted:#6b7280;
  --line:#e5e7eb; --line-strong:#d4d7dd; --accent:#3056c9; --accent-bg:#eef2ff;
  --ticket:#a4570b; --ticket-bg:#fff5e9; --ticket-line:#f0d3ac;
  --base:#1c56b8; --base-bg:#eef4ff; --base-line:#c9dbf7;
  --premium:#6a2fb0; --premium-bg:#f6f1fd; --premium-line:#ddcbf3;
  --convert:#0f7264; --convert-bg:#eafaf5; --convert-line:#b7e3d7;
  --danger:#b42318; --danger-bg:#fff2f0; --danger-line:#f7c9c3;
  --ok:#0f7a3d; --shadow:0 1px 2px rgba(16,20,28,.05),0 8px 24px -18px rgba(16,20,28,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1114; --surface:#171a1f; --surface2:#1c2026; --text:#e8eaee; --muted:#98a1ae;
    --line:#272c34; --line-strong:#343a44; --accent:#8ba6f5; --accent-bg:#18223c;
    --ticket:#e8a95c; --ticket-bg:#2a1f13; --ticket-line:#4a371f;
    --base:#82b1f5; --base-bg:#131f33; --base-line:#26405f;
    --premium:#bfa0ee; --premium-bg:#211830; --premium-line:#3c2b56;
    --convert:#5fd3b7; --convert-bg:#10241f; --convert-line:#1f4339;
    --danger:#f0857a; --danger-bg:#2c1614; --danger-line:#53251f;
    --ok:#5ec97f; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
b{font-weight:650}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--surface2);
  border:1px solid var(--line);border-radius:4px;padding:.05em .3em}
.wrap{max-width:1040px;margin:0 auto;padding:0 26px 80px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- app shell: collapsible left sidebar + content ---------- */
:root{--side-w:292px}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);align-items:start;
  transition:grid-template-columns .22s ease}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;min-width:0;
  background:color-mix(in srgb,var(--surface) 62%,var(--bg));border-right:1px solid var(--line)}
.main-col{min-width:0;position:relative}
.collapse-btn{position:absolute;top:16px;right:-13px;z-index:46;width:26px;height:26px;display:grid;
  place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);
  color:var(--muted);cursor:pointer;box-shadow:var(--shadow);padding:0}
.collapse-btn:hover{color:var(--accent);border-color:var(--accent)}
.collapse-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.collapse-btn svg{transition:transform .22s ease}
body.side-collapsed .collapse-btn svg{transform:rotate(180deg)}
.side-top{display:flex;align-items:flex-start;padding:14px 14px 10px 16px}
.brand{display:flex;gap:9px;align-items:flex-start;min-width:0}
.brand .mark{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:12.5px;
  font-weight:700;color:#fff;background:linear-gradient(140deg,var(--accent),var(--premium));letter-spacing:-.03em}
.brand-txt{min-width:0}
.kicker{display:block;font-size:10.5px;line-height:1.45;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted)}
h1{margin:2px 0 0;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.side-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 14px 16px;
  scrollbar-width:thin}
.side-scroll::-webkit-scrollbar{width:9px}
.side-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;
  background-clip:padding-box}
.lead{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
.gauge{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);box-shadow:var(--shadow)}
.gauge .ring{position:relative;width:56px;height:56px;flex:none}
.gauge svg{display:block;transform:rotate(-90deg)}
.gauge .ring-val{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:650}
.legend{display:grid;gap:1px;font-size:11.5px;line-height:1.5;color:var(--muted);min-width:0}
.legend b{color:var(--text)}
.side-sect{margin:18px 0 6px;padding-left:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted)}
.nav{display:grid;gap:2px}
.nav-item{position:relative;display:flex;gap:9px;align-items:center;width:100%;text-align:left;font:inherit;
  font-size:13.5px;color:var(--muted);background:none;border:1px solid transparent;border-radius:10px;padding:7px 8px;
  cursor:pointer;transition:background .12s,color .12s}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-item .ico{width:22px;height:22px;flex:none;display:none;place-items:center;border-radius:7px;font-size:11.5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.nav-item[aria-selected=true]{color:var(--text);background:var(--surface);border-color:var(--line);font-weight:650;
  box-shadow:var(--shadow)}
.cnt{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:0 6px;margin-left:auto}
.cnt.warn{color:var(--danger);border-color:var(--danger-line);background:var(--danger-bg)}
.outline{display:grid;gap:1px}
.ol-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;font:inherit;
  font-size:12.5px;text-align:left;color:var(--muted);background:none;border:0;border-left:2px solid transparent;
  border-radius:0 9px 9px 0;padding:5px 8px 5px 6px;cursor:pointer}
.ol-item:hover{background:var(--surface);color:var(--text)}
.ol-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ol-item.current{border-left-color:var(--accent);background:var(--surface);color:var(--text)}
.ol-item.current .ol-nm{font-weight:600}
.ol-no{font-size:11px;color:var(--muted);text-align:center}
.ol-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--line-strong);background:transparent}
.ol-dot.on{background:var(--ok);border-color:var(--ok)}
.side-foot{display:flex;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.side-foot .btn{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{flex:none;opacity:.7}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.peek{display:none;position:fixed;right:14px;bottom:16px;z-index:34;align-items:center;gap:7px;font:inherit;
  font-size:13px;padding:9px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--text);box-shadow:0 6px 20px -8px rgba(16,20,28,.45);cursor:pointer}
.peek b{font-variant-numeric:tabular-nums;color:var(--accent)}
.scrim{display:none;position:fixed;inset:0;z-index:35;border:0;padding:0;background:rgba(8,10,14,.44)}
main{padding-top:22px}
section.view{display:none}
section.view.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  margin-bottom:14px;overflow:hidden;scroll-margin-top:66px}
.card-hd{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;flex-wrap:wrap}
.card-hd h2,.card-hd h3{margin:0;font-size:16px;line-height:1.4}
.card-hd .spacer{flex:1}
.card-bd{padding:2px 16px 14px;border-top:1px solid var(--line)}
.dot{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:13px;
  font-weight:650;background:var(--surface2);border:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:2px 8px;border-radius:999px;border:1px solid}
.badge.tk{color:var(--ticket);background:var(--ticket-bg);border-color:var(--ticket-line)}
.badge.bs{color:var(--base);background:var(--base-bg);border-color:var(--base-line)}
.badge.pm{color:var(--premium);background:var(--premium-bg);border-color:var(--premium-line)}
.badge.cv{color:var(--convert);background:var(--convert-bg);border-color:var(--convert-line)}
.badge.nu{color:var(--muted);background:var(--surface2);border-color:var(--line)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .35s ease}
.bar.tl i.tk{background:var(--ticket)} .bar.tl i.bs{background:var(--base)}
.bar.tl i.pm{background:var(--premium)} .bar.tl i.cv{background:var(--convert)}
.bar.tl.multi{display:flex;background:var(--line)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:130px}
.prog .bar{flex:1}
.notes{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);
  font-size:13px;color:var(--muted);display:grid;gap:6px}
.notes p{margin:0}

/* ---------- checklist items ---------- */
.blk{margin-top:14px}
.blk-hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.blk-hd h4{margin:0;font-size:14px}
.blk-hd .sub{font-size:12.5px;color:var(--muted)}
.blk.lvl4{margin-top:12px}
.items{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;background:var(--surface);
  padding:9px 12px;cursor:pointer;transition:background .12s}
.item:hover{background:var(--surface2)}
.item input{appearance:none;margin:3px 0 0;width:16px;height:16px;border:1.5px solid var(--line-strong);
  border-radius:5px;background:var(--surface);cursor:pointer;position:relative;flex:none;transition:.12s}
.item input:hover{border-color:var(--accent)}
.item input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item input:checked{background:var(--accent);border-color:var(--accent)}
.item input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.item .txt{font-size:14px}
.item .txt .head{font-weight:600}
.item.done{background:color-mix(in srgb,var(--surface) 60%,var(--accent-bg))}
.item.done .txt{color:var(--muted)}
.item.done input:checked{background:var(--ok);border-color:var(--ok)}
.item.hit{background:var(--danger-bg)}
.item.hit input:checked{background:var(--danger);border-color:var(--danger)}
.item.hit .txt{color:var(--danger)}
.blk.done-all .items{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line-strong);
  border-radius:12px;background:var(--surface2)}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 0;background:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;min-width:230px;flex:1}
.search input{border:0;outline:0;background:none;color:inherit;font:inherit;flex:1;min-width:60px}
.search svg{flex:none;opacity:.55}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--surface);font-weight:600}
.chip.tp[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.btn{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}

/* ---------- overview ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.qcard{padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.qcard .n{font-size:11.5px;color:var(--muted);font-weight:650;letter-spacing:.06em}
.qcard p{margin:3px 0 0;font-size:14px}
h2.sect{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
h2.sect:first-child{margin-top:0}
.pyr{display:grid;gap:6px;justify-items:center;margin-top:4px}
.layer{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:6px}
.layer:hover{border-color:var(--accent)}
.layer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layer .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.layer .code{font-size:12px;color:var(--muted);width:20px;flex:none}
.layer .nm{font-weight:650;font-size:15px}
.layer .ds{font-size:12.5px;color:var(--muted);flex:1;min-width:180px}
.layer .prog{min-width:120px;flex:none;width:150px}
.layer .split{display:flex;gap:6px;flex-wrap:wrap}
.layer .split span{font-size:12px;padding:3px 8px;border-radius:8px;border:1px solid}
.layer.l1{border-left:3px solid var(--ticket)}
.layer.l2{border-left:3px solid var(--base)}
.layer.l3,.layer.l4,.layer.l5{border-left:3px solid var(--premium)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.track{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.track .t{font-size:13px;font-weight:650;display:flex;align-items:center;gap:7px}
.track .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.track.a{border-top:3px solid var(--ticket)} .track.b{border-top:3px solid var(--premium)}
.mkt{display:grid;gap:10px}
.mkt .r{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}
.mkt .k{font-weight:650;font-size:14px}
.mkt .now{font-size:13px;color:var(--muted);margin-top:2px}
.mkt .next{font-size:13px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.mkt .next::before{content:"→ 2027 ";font-size:11px;color:var(--accent);font-weight:650;letter-spacing:.04em}

/* ---------- score view ---------- */
.score-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.score-wrap .col{min-width:0}
.score-row .btn{padding:1px 8px;font-size:11.5px}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)}
.score-row:last-of-type{border-bottom:0}
.score-row .nm{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score-row .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font:inherit;font-size:12.5px;width:30px;height:28px;border:0;border-radius:6px;background:none;
  color:var(--muted);cursor:pointer}
.seg button:hover{background:var(--surface);color:var(--text)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--surface);font-weight:650}
.seg.s0 button[aria-pressed=true]{background:var(--danger)}
.seg.s1 button[aria-pressed=true]{background:var(--ticket);color:#fff}
.seg.s2 button[aria-pressed=true]{background:var(--base);color:#fff}
.seg.s3 button[aria-pressed=true]{background:var(--ok);color:#fff}
.next-act{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.next-act label{font-size:12px;color:var(--muted);flex:none}
.next-act input{flex:1;font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface2);color:inherit;min-width:0}
.next-act input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.total{display:flex;align-items:baseline;gap:12px;padding:14px 16px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.total .v{font-size:34px;font-weight:700;letter-spacing:-.02em}
.total .band{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;border:1px solid}
.band.b-hi{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:var(--ok)}
.band.b-mid{color:var(--base);background:var(--base-bg);border-color:var(--base-line)}
.band.b-lo{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-line)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:13.5px;
  border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger);margin-bottom:12px}
.alert.hide{display:none}
.alert svg{flex:none;margin-top:2px}
.radar{width:100%;height:auto;display:block}
.radar .grid{fill:none;stroke:var(--line);stroke-width:1}
.radar .spoke{stroke:var(--line-strong);stroke-width:1}
.radar .shape{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:2;
  stroke-linejoin:round;transition:d .3s ease}
.radar text.ax{font-size:11px;fill:var(--muted)}
.radar text.ax.strong{fill:var(--text);font-weight:600}
.radar text.val{font-size:10.5px;fill:var(--accent);font-weight:650}
.scale{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.scale span{padding:2px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface2)}
/* ---------- levels ---------- */
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.lv .card{margin:0}
.lv-hd{padding:13px 15px;border-bottom:1px solid var(--line);background:var(--surface2)}
.lv-hd .yrs{font-size:16px;font-weight:650}
.cutoff{margin:12px 14px 14px;padding:10px 12px;border-radius:10px;border:1px solid var(--danger-line);
  background:var(--danger-bg);font-size:13px;color:var(--danger)}
.cutoff b{display:block;font-size:12px;letter-spacing:.04em;margin-bottom:2px}
/* ---------- plan ---------- */
.plan{display:grid;gap:0}
.phase{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase .when{position:relative;padding-right:10px}
.phase .when .w{font-size:12px;color:var(--muted);letter-spacing:.04em}
.phase .when .t{font-size:14.5px;font-weight:650;margin-top:2px}
.phase .when::after{content:"";position:absolute;right:-8px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
/* ---------- flags ---------- */
.flags .items{border-color:var(--danger-line)}
.flags .item .txt{color:var(--text)}
.flags .card{border-color:var(--danger-line)}
.flags .item input{border-color:var(--danger-line)}
.flags .item{grid-template-columns:20px 1fr}
.count-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.count-line b{color:var(--danger);font-size:15px}
/* ---------- sources ---------- */
.src{display:grid;gap:7px;font-size:13px;color:var(--muted)}
.src li{margin-left:18px}
.rev{font-size:13px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:12px;margin:8px 0}
.quote{margin:18px 0 0;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:15.5px;line-height:1.7}
/* ---------- footer ---------- */
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
/* ---------- collapsed rail ---------- */
@media (min-width:961px){
  body.side-collapsed{--side-w:72px}
  body.side-collapsed .side-top{padding:14px 0 8px;justify-content:center}
  body.side-collapsed .brand{justify-content:center}
  body.side-collapsed .brand-txt,body.side-collapsed .lead,body.side-collapsed .legend,
  body.side-collapsed .side-sect,body.side-collapsed .outline,body.side-collapsed .nav-item .lab,
  body.side-collapsed .btn-label,body.side-collapsed .cnt{display:none}
  body.side-collapsed .side-scroll{padding:0 8px 12px}
  body.side-collapsed .gauge{justify-content:center;padding:4px 0;border-color:transparent;background:none;
    box-shadow:none}
  body.side-collapsed .ring,body.side-collapsed .ring svg{width:44px;height:44px}
  body.side-collapsed .ring-val{font-size:11px}
  body.side-collapsed .nav{margin-top:14px}
  body.side-collapsed .nav-item{justify-content:center;padding:8px 0}
  body.side-collapsed .nav-item .ico{display:grid}
  body.side-collapsed .nav-item[aria-selected=true]{border-color:var(--line)}
  body.side-collapsed .nav-item[aria-selected=true] .ico{background:var(--accent-bg);border-color:var(--accent);
    color:var(--accent)}
  body.side-collapsed .side-foot{justify-content:center;padding:10px 8px 12px}
  body.side-collapsed .side-foot .btn{flex:none;width:34px;height:31px;padding:0}
  body.side-collapsed .side-foot .btn svg{opacity:.85}
  body.side-collapsed .cnt.warn{display:block;position:absolute;top:1px;right:4px;margin:0;padding:0 3px;
    font-size:9.5px;transform:scale(.92)}
}
/* ---------- small screens: the sidebar slides in as a drawer ---------- */
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr);transition:none}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:290px;max-width:85vw;transform:translateX(-103%);
    transition:transform .24s ease;box-shadow:0 20px 50px -14px rgba(8,10,14,.45);background:var(--surface)}
  body:not(.side-collapsed) .side{transform:none}
  .collapse-btn{right:12px}
  .peek{display:inline-flex}
  body:not(.side-collapsed) .peek{display:none}
  body:not(.side-collapsed) .scrim{display:block}
  .wrap{padding:0 16px 92px}
  main{padding-top:16px}
}
/* ---------- responsive ---------- */
@media (max-width:860px){
  .pyr .layer{width:100%!important}
  .score-wrap{grid-template-columns:minmax(0,1fr)}
  .tracks{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr;gap:8px}
  .phase .when::after{display:none}
}
@media (max-width:560px){
  .toolbar{position:static}
  .item{grid-template-columns:18px 1fr;gap:8px;padding:9px 10px}
}
@media print{
  .side,.peek,.scrim{display:none!important}
  .app{display:block}
  .toolbar,.nav,.btn,.collapse-btn{display:none!important}
  section.view{display:block!important;page-break-inside:avoid}
  .card{box-shadow:none}
  body{background:#fff}
}
</style>
</head>

<script>
const DATA = {"docTitle":"2027 程序员求职必要能力清单（AI 时代版）","usage":["用法：每条都是<b>可验证的行为<\/b>，不是标签。打勾的标准是\"我能拿出证据\"，而不是\"我了解过\"。","建议每季度自评一次，配合附录 A 的打分表和附录 B 的证据库使用。","适用范围：国内 / 海外通用，覆盖校招到资深（0–10 年）。岗位以服务端 / 全栈 / AI 应用为主线，其他方向按附录 B 替换\"深井\"项即可。"],"overview":{"quick":["<b>\"会写代码\"从稀缺能力变成默认能力<\/b>。初稿由 agent 产出，人类的价值上移到定义问题、拆解、验证、担责。","<b>招人的门槛从\"产出量\"变成\"可靠产出量\"<\/b>。企业发现 AI 放大的是工程判断力的差距——强者提效数倍，弱者只是更快地生产返工。","<b>入门岗位收缩，中高级与应用层扩张<\/b>。初级坑位减少、要求提高；同时\"能把 AI 做进产品\"的岗位持续增长。","<b>面试是双轨的<\/b>。一路是\"允许用 AI 的项目型 + 深度追问\"；另一路是<b>不发电脑、只给纸笔<\/b>的笔试与手撕代码。前者决定你能拿多高，后者决定你有没有机会开口。","<b>新的分水岭技能<\/b>：上下文工程、Agent 编排、评测（eval）与可观测、AI 产出的安全审查。","<b>新的护城河<\/b>：业务纵深、存量系统的理解力、可校准的自我评估（知道自己不知道什么）。","<b>最危险的三种人<\/b>：离开 AI 就写不出代码的人；拒绝用 AI、把自己当纯手工 coder 的人；只会让 AI 写、自己闭卷讲不清内存与复杂度的人。","<b>能力分两类<\/b>：<b>门票型<\/b>（能被纸笔当场验证——算法、操作系统、网络、数据库原理）与<b>溢价型<\/b>（AI 协作、评测、判断力、业务纵深）。门票丢了，溢价能力根本没机会展示。"],"model":[{"code":"⑤","name":"信任资本","desc":"沟通 / 协作 / 公开证据（别人敢把事交给你）"},{"code":"④","name":"判断力","desc":"产品、业务、量化、取舍（决定做什么与不做什么）"},{"code":"③","name":"AI 构建力","desc":"把模型能力做进产品（Applied AI / Agent / 评测 / 成本）"},{"code":"②","name":"AI 协作力","desc":"把 AI 当工程系统来用（上下文 / 编排 / 验证 / 护栏）"},{"code":"①","name":"工程底座","desc":"闭卷（算法/OS/网络/DB 原理）+ 实践（读得懂、验得出、担得起）"}],"modelNote":["底座塌了，上面全是幻觉；只有底座没有 ②③，2027 年的简历会显得\"上一代\"。④⑤ 则是同级别候选人里唯一能拉开差距的部分。","底座 ① 还要拆成两半看：<b>闭卷可验证的部分是门票<\/b>（笔试、手撕、原理快问快答），<b>工程实践部分是基础<\/b>——它很少被直接考，但它决定你声称的溢价能力有没有人信。门票的残酷之处在于它不看作品、不听故事，只看你此刻能不能在纸上把代码和原理写对。"],"market":{"title":"市场底噪（用于校准策略，不是背书）","rows":[["观察","2026 年公开口径","对 2027 的推演"],["技能重构速度","Gartner 预计 2027 年约 80% 的软件工程师需要因 AI 重新技能化","\"用过 AI\"不再是加分项，而是默认预期"],["初级岗位","头部大厂校招/入门岗招聘量明显收缩（SignalFire、WEF 等口径均显示下滑）","校招与 0–2 年需要更强的\"可验证作品\"来竞争"],["整体需求","美国 BLS 仍预测 2024–2034 软件开发岗位两位数增长","总量没消失，分布变了：更偏业务侧、AI 侧、平台侧"],["面试（新增赛道）","多家企业与评估机构转向\"允许使用 AI\"的项目型面试（Karat、formation 等）","追问\"你为什么这么做\"的权重上升"],["面试（存量现实）","国内校招普遍保留 ACM 模式线上笔试与面试手撕（禁 IDE 补全与 AI）；海外 whiteboard / 纸笔设计题仍大量存在。此信号在 AI 初创最弱，在大厂、金融、国企、外包链路最强","<b>闭卷基本功仍是第一道筛子<\/b>：它是招聘方成本最低、可横向比较的能力代理指标，2027 年不会消失"],["代码质量","多数工程师不完全信任 AI 代码，但只有一部分人每次都会验证；AI 生成代码仍高频引入 OWASP 类缺陷（SonarSource、Veracode 年度报告）","\"能抓住 AI 的错\"成为可量化、可展示的核心竞争力"],["岗位 JD","头部大厂后端/校招技术岗中大模型、Agent、RAG 相关要求的占比显著上升","应用层 AI 工程能力会像\"会用 Git\"一样成为硬性门槛"]],"notes":["以上为方向性参考，来源与口径见文末。真正决定结果的是你在<b>一家具体公司的一条具体业务线<\/b>上的可信度。"]}},"cards":[{"no":"2","title":"① 工程底座：闭卷基本功 + 工程实践","layer":"①","layerName":"工程底座","notes":["双轨准备：一边是允许用 AI 的项目型面试，一边是不给电脑、只发一张纸的手撕与笔试。","任何一条没准备好都会当场出局，别用一条的存在去否定另一条。"],"prose":["<b>为什么 AI 时代还必须闭卷掌握<\/b>：模型能替你写代码，但替不了你判断。不懂页表与缺页，就看不出 AI 引入的内存抖动；不懂 MVCC 与间隙锁，就发现不了它写的事务在高并发下会死锁；不懂复杂度与缓存局部性，就评不出它那段\"能跑\"的方案上线后会不会挂。<b>闭卷知识的深度，直接决定你检出 AI 错误的能力上限。<\/b>"],"blocks":[{"id":"2.1","name":"闭卷基本功：纸和笔仍会考（门票）","sub":"","notes":[],"cutoff":"","depth":0,"items":[],"subs":[{"id":"2.1#0","name":"手撕代码（必须闭卷达成）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#0:0","t":"纸上手写 medium 题 20 分钟内写出正确解：命名一致、边界闭合、口头 trace 一遍无 bug"},{"k":"2.1#0:1","t":"常见结构徒手实现：链表反转与快慢指针、二叉树三种遍历（递归 + 迭代）、BFS/DFS、堆与 Top-K、并查集、拓扑排序、LRU / LFU"},{"k":"2.1#0:2","t":"排序与查找能手推：快排退化条件与优化、堆排原地实现、归并的空间代价、二分的不变式写法（固定一种并解释清）、第 K 小与三色划分"},{"k":"2.1#0:3","t":"DP / 滑窗 / 双指针 / 前缀和 / 单调栈：白板上从暴力推到最优，说清状态定义与转移"},{"k":"2.1#0:4","t":"递归能改迭代：画出调用栈，说明栈溢出边界"},{"k":"2.1#0:5","t":"复杂度张口就来：时间与空间、均摊分析（动态数组扩容、路径压缩）、什么情况下常数项比渐近阶更重要"},{"k":"2.1#0:6","t":"手写代码自带验证意识：主动写测试用例、说明输入校验与失败语义（没有 IDE 也能证明它对）"}],"subs":[],"type":"门票"},{"id":"2.1#1","name":"操作系统（高频闭卷考点）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#1:0","t":"进程 / 线程 / 协程：调度单位、切换成本、地址空间与共享方式；内核调度 vs 用户态调度（epoll + 协程、事件循环、GIL）"},{"k":"2.1#1:1","t":"虚拟内存：多级页表、TLB、缺页中断、COW、swap、mmap 与共享内存；能区分 VSS / RSS / 脏页"},{"k":"2.1#1:2","t":"并发与同步：死锁四条件与破坏方式、互斥锁 / 自旋锁 / 信号量的适用与代价、伪共享与 cache line、内存序与 happens-before"},{"k":"2.1#1:3","t":"I/O 模型：阻塞 / 非阻塞 / 多路复用，select / poll / epoll 的差别与 LT vs ET，零拷贝（DMA、sendfile）到底省掉了什么"},{"k":"2.1#1:4","t":"文件系统与存储：inode、页缓存、fsync 与持久性、写放大、日志结构"},{"k":"2.1#1:5","t":"系统调用与中断：为什么慢、开销来自哪里；fork / exec / wait，僵尸与孤儿进程，fd 泄漏如何排查（lsof、/proc）"},{"k":"2.1#1:6","t":"容器本质：namespace + cgroup + 镜像分层；为什么\"1 核\"的容器可能跑不出裸机 1 核的性能（CPU quota 与 CFS period）"}],"subs":[],"type":"门票"},{"id":"2.1#2","name":"计算机组成 / 体系（解释性能问题必备）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#2:0","t":"cache 层级与命中率、时间与空间局部性、分支预测、流水线气泡、乱序执行对性能直觉的影响"},{"k":"2.1#2:1","t":"Amdahl 定律与扩展性：为什么加机器不总是线性，瓶颈如何定位"},{"k":"2.1#2:2","t":"数值与位：浮点误差、溢出回绕、字节序、对齐与填充"}],"subs":[],"type":"门票"},{"id":"2.1#3","name":"网络（纸上画图 + 推时序）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#3:0","t":"三次握手 / 四次挥手在纸上画出完整状态机：SYN 队列、半连接与全连接、TIME_WAIT 为什么是 2MSL、TIME_WAIT 与 CLOSE_WAIT 堆积分别意味着什么"},{"k":"2.1#3:1","t":"HTTP/1.1 与 /2 多路复用及队头阻塞、/3 用 QUIC 解决了什么、TLS 1.2 vs 1.3 的往返差异与 0-RTT 风险"},{"k":"2.1#3:2","t":"\"输入 URL 到页面渲染\"能连续讲 8 分钟不含糊（DNS、TCP、TLS、CDN、应用层、各级缓存）"},{"k":"2.1#3:3","t":"拥塞控制直觉（慢启动、拥塞避免、快恢复）、滑动窗口与流控、Nagle 造成的延迟毛刺"},{"k":"2.1#3:4","t":"抓包排查思路：如何用 tcpdump / Wireshark 定位重传、RST、连接被中间设备掐断"}],"subs":[],"type":"门票"},{"id":"2.1#4","name":"数据库原理（闭卷手算）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#4:0","t":"B+ 树 vs LSM-tree：为什么一个偏读一个偏写，空间放大与写放大的取舍"},{"k":"2.1#4:1","t":"索引：聚簇与二级、回表、覆盖索引、最左前缀、区分度与选择性；给一条 SQL 能手算走不走索引、大致扫多少行"},{"k":"2.1#4:2","t":"事务与 MVCC：undo / ReadView / purge 如何协作、各隔离级别的实现代价、间隙锁与插入意向锁导致的死锁场景"},{"k":"2.1#4:3","t":"redo / undo / binlog 的职责与两阶段提交：崩溃后为什么能恢复、主从为什么会不一致、半同步与延迟从库怎么用"},{"k":"2.1#4:4","t":"连接池参数、慢查询定位、explain 各字段的读法"}],"subs":[],"type":"门票"},{"id":"2.1#5","name":"语言运行时（主力语言必被追问）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#5:0","t":"GC：分代或三色标记、停顿来源、如何定位泄漏与调优；或说清引用计数的循环引用问题与替代方案"},{"k":"2.1#5:1","t":"对象布局与内存分配：逃逸、装箱、拷贝的真实成本，为什么\"少分配\"常常比\"少算一次\"更有效"},{"k":"2.1#5:2","t":"并发语法与陷阱：goroutine 泄漏 / asyncio 中的阻塞调用 / Java 线程池参数与拒绝策略 / C++ 未定义行为"}],"subs":[],"type":"门票"},{"id":"2.1#6","name":"备考方法（闭卷能力只能用闭卷的方式练）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"2.1#6:0","t":"建错题本：每题记录\"当时卡在哪 + 正确的不变式是什么\"，考前全部重做"},{"k":"2.1#6:1","t":"每周 2 次纯纸笔模拟：无 IDE、无补全、无 AI，20 分钟计时，写完自己当编译器逐行 trace"},{"k":"2.1#6:2","t":"用嘴讲原理：随机抽一个 OS / 网络考点，对着空房间讲 "3.2","name":"验证与信任边界（2027 最重要的差异化能力）","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"3.2:0","t":"默认不信任：任何 AI 产出都必须经过类型检查、lint、测试、静态分析或人工逐行审查之一才允许合并"},{"k":"3.2:1","t":"能在 30 分钟内从一份 AI 生成的 PR 里挑出：不存在的 API、幻觉依赖、被悄悄改掉的边界条件、越权/注入、竞态、被删的测试"},{"k":"3.2:2","t":"有\"埋雷练习\"习惯：定期用已知有缺陷的 AI 产出测自己的检出率，并记录"},{"k":"3.2:3","t":"会写 eval 而不是靠试 prompt：对高频任务建立小样本测试集 + 打分口径 + 回归基线"},{"k":"3.2:4","t":"会控成本与延迟：模型档位路由、prompt 缓存、上下文瘦身、批量与小模型前置，能给出单位任务成本"},{"k":"3.2:5","t":"明确知道哪些不能自动化：破坏性操作、数据迁移、合规审计、权限变更——并会设计人工确认关口"},{"k":"3.2:6","t":"有个人可迁移资产库（规则、prompt、脚本、评测集），且换工具时能在一天内迁移完成——不被单一产品锁定"},{"k":"3.2:7","t":"能拿出<b>量化的提效证据<\/b>：某功能从 N 人日降到 M 人日，返工率 / 缺陷率 / 评审驳回率如何变化"}],"subs":[],"type":"溢价","weight":null}],"total":13},{"no":"4","title":"③ AI 构建力：把模型能力做进产品","layer":"③","layerName":"AI 构建力","notes":[],"prose":[],"blocks":[{"id":"4","name":"","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"4:0","t":"原理够用层：token 与上下文窗口、采样参数的实际影响、为什么会产生幻觉、RAG vs 微调 vs 长上下文的成本与适用边界"},{"k":"4:1","t":"API 工程：tool / function calling、结构化输出与 schema 校验、流式、重试与幂等、超时预算、失败降级"},{"k":"4:2","t":"RAG：分块与嵌入策略、混合检索与重排、检索质量度量（recall@k / 引用准确率）、知识更新与失效、<b>权限继承（不要让 RAG 变成越权通道）<\/b>、答案溯源"},{"k":"4:3","t":"Agent 架构：规划-执行循环、状态机与可恢复性、工具层设计、记忆与上下文管理、并行子任务、失败恢复、human-in-the-loop 插入点"},{"k":"4:4","t":"评测体系：离线数据集 + 在线 A/B + LLM-as-judge 的已知偏差 + 人工标注校准；能做错误归因而非\"感觉变好了\""},{"k":"4:5","t":"可观测与运维：每次 LLM / 工具 / 检索调用可追踪，token 与成本监控，质量退化告警，Prompt 与模型版本管理与回归"},{"k":"4:6","t":"AI 安全：prompt injection / 越狱 / 工具滥用 / 数据外泄路径，输出护栏与内容合规，最小权限的工具授权，审计日志"},{"k":"4:7","t":"成本工程：单位任务成本模型、路由策略、缓存命中率、批处理窗口、超预算时的降级方案"},{"k":"4:8","t":"数据能力：知道什么任务值得微调（格式 / 风格 / 窄域），SFT / LoRA / 偏好优化各自需要多少数据、如何验收；会构建与清洗评测集"},{"k":"4:9","t":"至少做过一条跨模态链路（图像 / 语音 / 视频），能说清延迟、成本与失败模式"},{"k":"4:10","t":"交付过<b>有真实用户<\/b>的 AI 功能，并能说出它的评测结果、成本、失败率和三轮迭代过程"},{"k":"4:11","t":"反向能力：能识别不该用模型的地方，用规则 / SQL / 检索 / 确定性算法替代，避免\"为了 AI 而 AI\""}],"subs":[],"type":"溢价","weight":null}],"total":12},{"no":"5","title":"④ 判断力：产品、业务与量化","layer":"④","layerName":"判断力 / 业务","notes":[],"prose":[],"blocks":[{"id":"5","name":"","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"5:0","t":"能把模糊需求写成单页问题定义：用户、场景、当前替代方案、成功指标、明确不做什么"},{"k":"5:1","t":"会算账：需求 ROI、单位经济、性能与成本的兑换比（1 万 QPS 省 30% 值不值得投 2 人月）"},{"k":"5:2","t":"能砍范围：在期限内交付\"可信的最小闭环\"，而不是一份庞大的半成品"},{"k":"5:3","t":"<b>业务纵深<\/b>：至少一个行业的领域语言与流程（金融 / 医疗 / 制造 / 物流 / 电商 / 教育 / 政企……）。这是 AI 最难替代、也最容易让你变成\"不可替代的那个人\"的东西"},{"k":"5:4","t":"存量资产理解力：能讲清公司老系统为什么长成这样、哪些债务能动哪些不能动"},{"k":"5:5","t":"数据素养：会埋点、看漏斗、做基本显著性判断、识别被操纵的指标"},{"k":"5:6","t":"有产品品味：能指出自己常用产品的一个真实缺陷并给出更好的方案"},{"k":"5:7","t":"风险直觉：能在评审时预判一处改动的线上 / 合规 / 安全风险，并主动加防护与监控"},{"k":"5:8","t":"技术选型能被追问三层：为什么是它、否掉了什么、代价是什么、什么信号出现时要换掉"}],"subs":[],"type":"溢价","weight":null}],"total":9},{"no":"6","title":"⑤ 信任资本：沟通、协作与公开证据","layer":"⑤","layerName":"信任资本","notes":[],"prose":[],"blocks":[{"id":"6","name":"","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"6:0","t":"技术写作：写过被同事真实引用过的 RFC / 设计文档 / 排障复盘"},{"k":"6:1","t":"口头表达：5 分钟讲清一个复杂系统；有一次跨团队说服的真实案例"},{"k":"6:2","t":"Code review：有稳定风格的评审记录，能给 AI 生成的代码写出\"人话\"评论（指出问题 + 影响 + 建议）"},{"k":"6:3","t":"带人与影响力：辅导过新人、做过内部分享或公开演讲、维护过技术内容"},{"k":"6:4","t":"公开可验证资产：GitHub 上有被真实维护过的项目或 PR、技术问答、博客（看的是一致性与真实度，不是 star 数）"},{"k":"6:5","t":"推荐网络：3 个以上愿意在 24 小时内为你背书 / 内推的人"},{"k":"6:6","t":"主线一致：简历、GitHub、博客、LinkedIn 讲的是同一个故事"},{"k":"6:7","t":"可校准的自我评估：面试中能准确说\"这里我不确定\"，并给出求解路径。AI 时代这是稀缺信号，因为它直接预测你会不会放过 AI 的错误"}],"subs":[],"type":"溢价","weight":null}],"total":8},{"no":"7","title":"AI 时代求职资产：简历、作品集、面试","layer":"★","layerName":"求职资产","notes":[],"prose":[],"blocks":[{"id":"7.1","name":"简历","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"7.1:0","t":"每条经历都是\"动作 + 结果 + 度量\"（成本、延迟、转化、缺陷率、人力节省）"},{"k":"7.1:1","t":"AI 经历写<b>方法与治理<\/b>，不写关键词：例如\"制定团队 AI 辅助开发规范 + 评审关口，季度返工率从 X% 降到 Y%\""},{"k":"7.1:2","t":"一条清晰主线（我是谁 / 我的深井是什么），删掉\"熟悉 20 种技术栈\"式列表"},{"k":"7.1:3","t":"一页、无花哨排版、术语与目标岗位 JD 真实对应（机器与人双读）"},{"k":"7.1:4","t":"经得起逐行追问：任何一行被问到细节都不会卡壳"},{"k":"7.1:5","t":"有\"可信的 AI 使用痕迹\"：项目里标注哪些由 agent 完成、你如何验证——诚实比隐藏更加分"}],"subs":[],"type":"转化","weight":null},{"id":"7.2","name":"作品集","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"7.2:0","t":"1 个可现场演示的项目：已部署、有 README、有截图或录屏、有 demo 账号"},{"k":"7.2:1","t":"1 个 AI 深度项目：包含评测数据、失败案例分析、成本与延迟数据（不是\"调了个 API 做聊天框\"）"},{"k":"7.2:2","t":"项目里能看到<b>你的判断<\/b>：设计文档、被否决的方案、迭代记录"},{"k":"7.2:3","t":"提交历史真实可信：不是一次性 3000 行 commit；能解释关键演进节点"},{"k":"7.2:4","t":"有工程基础设施：CI、测试、lint、可观测性中至少两项，证明你会交付而不只是会写"}],"subs":[],"type":"转化","weight":null},{"id":"7.3","name":"面试","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"7.3:0","t":"纸笔 / 白板轮：没有编译器也能写出可运行代码，主动 trace 并说明不变式与测试用例"},{"k":"7.3:1","t":"原理快问快答：进程 vs 线程 vs 协程、虚存与缺页、epoll 为什么快、MVCC、索引失效、握手时序——每题 30 秒内给出结构清晰的回答"},{"k":"7.3:2","t":"手撕时间控制：medium 题 20 分钟内 AC（含边界与自测）；超时时主动说明降级思路"},{"k":"7.3:3","t":"适应\"允许使用 AI\"的面试：能借助 AI 高效完成，同时被逐步追问时说清每一步决策"},{"k":"7.3:4","t":"准备好\"挑 AI 的错\"环节：给你一段 AI 代码或方案，能系统地说出问题、影响与修法"},{"k":"7.3:5","t":"系统设计：40 分钟内从需求推到架构、瓶颈、演进路径、粗略成本"},{"k":"7.3:6","t":"排障故事：有具体数字与时间线的真实线上事故复盘（现象 → 定位 → 止血 → 根因 → 长期修复）"},{"k":"7.3:7","t":"项目追问：能讲清\"重来一次你会怎么做\"，展示反思而不只是战绩"},{"k":"7.3:8","t":"反问有质量：这个团队如何处理 AI 引入的质量风险？评测与回归怎么做？哪块业务最缺人？"},{"k":"7.3:9","t":"三套叙事时长：60 秒自我介绍、5 分钟项目概述、30 分钟深度版本"},{"k":"7.3:10","t":"诚实边界：不知道就说不知道，并给出你会怎么查"}],"subs":[],"type":"转化","weight":null},{"id":"7.4","name":"报价与合同：面试之后，谈判才刚开始","sub":"","notes":["为什么单列：前面所有能力，最终要过\"报价—合同—入职\"这道窄门才兑现成结果。这一步几乎不考技术，却直接决定你未来 2–4 年的现金、风险与自由度；而且它可准备、可排练，不准备等于白送。"],"cutoff":"","depth":0,"items":[],"subs":[{"id":"7.4#0","name":"定薪与报价","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"7.4#0:0","t":"报价前先锚定区间：用 levels.fyi / 脉脉 / 同行内推消息，给出该岗位·该城市·该级别的 P25/P50/P75 三档，报有据可依的数，不说\"我都能接受\""},{"k":"7.4#0:1","t":"会拆总包：base × 月数、绩效（几个月、发放口径与历史达成率）、签字费、股票/期权（授予价、vesting 节奏、cliff、行权价与估值兑水）——能在一页纸上把 offer 换算成\"税前/税后年化现金 + 期望股权价值\""},{"k":"7.4#0:2","t":"手里至少有一条可比较的线（真实 offer 或明确进度）抬确定性；没有也要会礼貌地制造时间窗，不被逼着当场拍板"},{"k":"7.4#0:3","t":"谈判话术排练过：如何请求高于报价、如何把\"我更要 base 还是签字费\"讲成对公司合理的诉求、被压价时的退让顺序"},{"k":"7.4#0:4","t":"知道各项的弹性排序（通常 base 最难、签字费最易、股票看政策），据此决定在哪项上争取"}],"subs":[],"type":"转化"},{"id":"7.4#1","name":"合同与风险条款（国内尤其要看）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"7.4#1:0","t":"看清签约主体：本公司还是外包/关联/第三方人力——主体决定劳动关系与赔偿归属"},{"k":"7.4#1:1","t":"竞业限制：范围、地域、期限、启动条件与补偿标准（离职后按月付？不给钱也生效？）；清楚\"被竞业\"意味着什么、违约金量级"},{"k":"7.4#1:2","t":"知识产权 / 职务作品归属、兼职与开源限制条款（想做独立开发前必看）"},{"k":"7.4#1:3","t":"试用期：时长、薪资打折比例、录用条件是否写清（关系到被\"毕业\"时的举证与赔偿）"},{"k":"7.4#1:4","t":"期权协议细则：离职后行权窗口（90 天陷阱）、回购、信息权"},{"k":"7.4#1:5","t":"社保公积金是否按真实基数缴纳，警惕\"自愿放弃\"式违规话术"},{"k":"7.4#1:6","t":"服务期与违约：落户、培训、签字费绑定的服务年限与按比例退还"}],"subs":[],"type":"转化"},{"id":"7.4#2","name":"空窗与被裁的叙事（诚实 + 有框架）","sub":"","notes":[],"cutoff":"","depth":1,"items":[{"k":"7.4#2:0","t":"备好一段 60 秒、不卑不亢的\"上一段为什么结束\"：被裁就如实说是组织收缩/业务调整，立刻把重心转到\"这段时间做了什么可验证的事\"（回指 7.2 作品与 2.1 手撕证据）"},{"k":"7.4#2:1","t":"空窗期能拿出\"结构性利用\"的证据（学习清单、作品迭代、评测/开源记录），而不是\"休息 / 在找工作\""},{"k":"7.4#2:2","t":"红线：不伪造在职状态、不编造离职时间、不把被裁说成主动离职——背调与社保记录查得出，被抓即清零全部信任资本"},{"k":"7.4#2:3","t":"心理口径：把被裁归因到\"岗位/业务\"而非\"我这个人\"，别因一次裁员在报价上自贬"}],"subs":[],"type":"转化"},{"id":"7.4#3","name":"收尾动作","sub":"","notes":["一句话：能力让你拿到 offer 资格，报价与合同决定这份 offer 值不值。这一步丢的分，前面补不回来。"],"cutoff":"","depth":1,"items":[{"k":"7.4#3:0","t":"口头 offer 到书面 offer 之间不当已定；入职时间、汇报对象、职级、定薪四项尽量落到邮件白纸黑字"},{"k":"7.4#3:1","t":"拒 offer / 反悔 / 放弃更高报价时保留关系——行业很小，两年后对面可能就是新东家"}],"subs":[],"type":"转化"}],"type":"转化","weight":null}],"total":40}],"levels":{"title":"分级门槛线","notes":[],"cards":[{"id":"s8b0","name":"校招 / 0–2 年","sub":"","notes":["社招与 2–5 年档同样要保门票：多数公司的手撕与原理轮不会因为是社招就取消，只是难度从\"刷题量\"转为\"你主力技术栈的底层\"。"],"cutoff":"笔试过不了（作品再好也见不到面试官）；纸上手撕写不出正确解；作品是教程复刻；说不出如何验证 AI 产出","depth":0,"items":[{"k":"s8b0:0","t":"<b>门票项<\/b>：2.1 节\"手撕代码\"部分全部达标（这是笔试与一面的硬筛子）"},{"k":"s8b0:1","t":"<b>门票项<\/b>：OS / 网络 / 数据库 / 组成四块，每块能连续讲 3 分钟不卡壳"},{"k":"s8b0:2","t":"第 2.2 节工程实践项达到 8 项以上（调试、测试、数据库、网络为必选）"},{"k":"s8b0:3","t":"第 3 节协作力全部达标——这是你相对资深者的少数结构性优势：没有\"手艺人包袱\""},{"k":"s8b0:4","t":"1 个有真实用户（哪怕 10 人）的作品 + 1 个含评测数据的 AI 项目"},{"k":"s8b0:5","t":"一口深井的雏形：一个能聊 30 分钟不换话题的技术主题"},{"k":"s8b0:6","t":"能独立解释你项目里每一行代码的取舍（AI 写的也要能解释）"}],"subs":[],"keyword":"可验证潜力 + AI 协作习惯","years":"校招 / 0–2 年"},{"id":"s8b1","name":"2–5 年","sub":"","notes":[],"cutoff":"只有执行没有决策；简历里找不到任何数字；只做过 demo 没做过线上","depth":0,"items":[{"k":"s8b1:0","t":"独立负责过一个上线并存活的服务/模块，含容量、监控、告警、成本"},{"k":"s8b1:1","t":"第 4 节 AI 构建力至少 6 项达标，其中 RAG、Agent、评测三项必须能落地"},{"k":"s8b1:2","t":"有跨团队推动记录（技术方案被别人接受并落地）"},{"k":"s8b1:3","t":"能做 code review 并承担 AI 相关事故的根因分析"},{"k":"s8b1:4","t":"业务纵深开始形成：能独立和一个业务方讨论需求优先级"}],"subs":[],"keyword":"端到端负责 + 有量化的结果","years":"2–5 年"},{"id":"s8b2","name":"5 年+ / 资深 / Lead","sub":"","notes":[],"cutoff":"资历等于\"年限 × 同一年经验\"；把 AI 当威胁而不是杠杆；讲不出组织层面的改变","depth":0,"items":[{"k":"s8b2:0","t":"定义过技术方案或架构标准，并留下了可复用的组织能力（规范、平台、评测体系）"},{"k":"s8b2:1","t":"能评估 AI 对团队产能与质量的真实影响，并重新设计流程（评审关口、责任划分、度量）"},{"k":"s8b2:2","t":"有商业判断：能对一个方向说\"不做\"，并说清机会成本"},{"k":"s8b2:3","t":"带出人：培养过至少 2 个可信的工程师"},{"k":"s8b2:4","t":"有行业信用：演讲、开源、文章或稳定的推荐网络"}],"subs":[],"keyword":"判断力 + 组织杠杆","years":"5 年+ / 资深 / Lead"}]},"plan":{"title":"90 天行动计划","notes":[],"phases":[{"id":"s9b0","name":"定位与体检","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"s9b0:0","t":"用附录 A 打分表自评，找出最弱的 2 项和最容易补的 2 项"},{"k":"s9b0:1","t":"选定目标岗位画像（3 类）并抓 20 条真实 JD 做词频与要求归纳"},{"k":"s9b0:2","t":"确定你的\"深井\"主题和\"主线故事\"一句话"}],"subs":[],"week":"第 1–2 周"},{"id":"s9b1","name":"补底座与协作","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"s9b1:0","t":"每天 45 分钟<b>纸笔<\/b>手撕：一道题 + 错题本复盘（不碰 IDE，写完自己 trace）"},{"k":"s9b1:1","t":"每天 30 分钟原理口述：OS / 网络 / 数据库 / 组成 轮换，每次一个考点讲 3 分钟"},{"k":"s9b1:2","t":"每周 2 次 20 分钟纸笔计时模拟（与 2.1 备考方法同口径，其中 1 次只做错题重做）+ 1 次开源代码精读（做笔记）"},{"k":"s9b1:3","t":"建立个人 AI 工作台：规则文件、prompt/eval 库、脚本、MCP 工具，写成一页使用说明"},{"k":"s9b1:4","t":"做 3 次\"埋雷 PR\"自检练习，记录检出率并从 60% 提升到 90%+"},{"k":"s9b1:5","t":"给现有项目补齐测试 + CI + lint，并量化前后差异"}],"subs":[],"week":"第 3–6 周"},{"id":"s9b2","name":"做一个能拿去面试的 AI 项目","sub":"","notes":[],"cutoff":"","depth":0,"items":[{"k":"s9b2:0","t":"选定一个真实小场景（自己或朋友的痛点），一周内做出可用版本"},{"k":"s9b2:1","t":"加检索或 Agent 能力，接入 tracing 与成本统计"},{"k":"s const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const attr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const plain = s => String(s).replace(/<[^>]+>/g, "");
const stripGlyph = s => s.replace(/^[①②③④⑤]\s*/, "");
const isRTL = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ----------------------------- item + block markup ----------------------------- */
function splitHead(t) {
  const i = t.indexOf("：");
  if (i > 0 && i <= 34) return '<span class="head">' + t.slice(0, i) + "</span>" + t.slice(i);
  return t;
}
function itemHTML(it, flag) {
  const p = attr(plain(it.t).toLowerCase());
  return '<label class="item' + (flag ? " flag" : "") + '" data-k="' + it.k + '" data-s="' + p + '">' +
    '<input type="checkbox" data-k="' + it.k + '"' + (state.checks[it.k] ? " checked" : "") + ">" +
    '<span class="txt">' + splitHead(it.t) + "</span></label>";
}
function itemsHTML(list, flag) {
  return '<div class="items">' + list.map(it => itemHTML(it, flag)).join("") + "</div>";
}
function collect(node, bucket) {
  node.items.forEach(it => bucket.push(it.k));
  node.subs.forEach(s => collect(s, bucket));
  return bucket;
}
function blockHTML(b, typeOverride) {
  const type = typeOverride || b.type || "溢价";
  const keys = collect(b, []);
  AGG["blk:" + b.id] = keys;
  let h = '<div class="blk lvl' + (b.depth ? 4 : 3) + '" data-blk="' + b.id + '" data-type="' + type + '">';
  if (b.name) {
    h += '<div class="blk-hd"><h4>' + b.name + "</h4>" +
      (b.sub ? '<span class="sub">' + b.sub + "</span>" : "") +
      '<span class="spacer" style="flex:1"></span>' +
      '<span class="badge ' + TC[type] + '">' + type + "</span>" +
      progHTML("blk:" + b.id) + "</div>";
  }
  if (b.notes && b.notes.length) h += '<div class="notes">' + b.notes.map(n => "<p>" + n + "</p>").join("") + "</div>";
  if (b.items.length) h += itemsHTML(b.items, false);
  if (b.cutoff) h += '<div class="cutoff"><b>淘汰线</b>' + b.cutoff + "</div>";
  h += (b.subs || []).map(s => blockHTML(s, type)).join("");
  return h + "</div>";
}
function progHTML(id, wide) {
  return '<span class="prog" data-agg="' + id + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" ' +
    'aria-valuenow="0" style="' + (wide ? "width:150px" : "") + '"><span class="bar tl"><i></i></span>' +
    '<span class="pl"></span></span>';
}

  h += '<h2 class="sect">' + esc(plain(o.market.title || "市场底噪")) + "</h2>";

function allItems() { return $$("#view-list .item"); }
const filters = { q: "", st: "all", ty: "" };

/* radar -------------------------------------------------------------- */
let radarPrev = null, radarRAF = 0;
function radarPoints(vals, cx, cy, R) {
  const n = vals.length;
  return vals.map((v, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const r = (Math.max(0, Math.min(3, v)) / 3) * R;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
}
function pathOf(pts) {
  return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + "Z";
}
function drawRadar(vals, has) {
  const box = $("#radarBox"); if (!box) return;
  const W = 400, H = 330, cx = W / 2, cy = H / 2 + 2, R = 96;
  const rows = DATA.scoring.rows, n = rows.length;
  const at = i => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  let g = "";
  [1, 2, 3].forEach(lv => {
    g += '<polygon class="grid" points="' + radarPoints(rows.map(() => lv), cx, cy, R)
      .map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '"/>';
  });
  rows.forEach((r, i) => {
    g += '<line class="spoke" x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(at(i))).toFixed(1) +
      '" y2="' + (cy + R * Math.sin(at(i))).toFixed(1) + '"/>';
  });
  const labels = rows.map((r, i) => {
    const a = at(i), cos = Math.cos(a), sin = Math.sin(a);
    const lx = cx + (R + 14) * cos, ly = cy + (R + 14) * sin + 4;
    const anchor = Math.abs(cos) < .35 ? "middle" : (cos > 0 ? "start" : "end");
    return '<text class="ax' + (r.type === "门票" ? " strong" : "") + '" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) +
      '" text-anchor="' + anchor + '">' + esc(r.axis) + "</text>" +
      (has ? '<text class="val" x="' + lx.toFixed(1) + '" y="' + (ly + 12).toFixed(1) + '" text-anchor="' + anchor +
        '">' + (state.scores[r.k] || 0) + "/3</text>" : "");
  }).join("");
  box.innerHTML = '<svg class="radar" viewBox="0 0 ' + W + " " + H + '" role="img" aria-labelledby="radarSR">' +
    g + '<path class="shape" id="radarPath" d="' + pathOf(radarPoints(vals, cx, cy, R)) + '"/>' + labels +
    (has ? "" : '<text class="ax" x="' + cx + '" y="' + cy + '" text-anchor="middle">打分后显示能力形状</text>') + "</svg>";
  $("#radarSR").textContent = "能力自评雷达图：" + rows.map((r, i) => r.axis + " " + vals[i] + " 分").join("，");
  if (isRTL || !has) { radarPrev = vals.slice(); return; }
  const from = (radarPrev || vals.map(() => 0)).slice();
  const t0 = performance.now(), dur = 320;
  cancelAnimationFrame(radarRAF);
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    const p = $("#radarPath"); if (!p) return;
    p.setAttribute("d", pathOf(radarPoints(vals.map((v, i) => from[i] + (v - from[i]) * e), cx, cy, R)));
    if (k < 1) radarRAF = requestAnimationFrame(step); else radarPrev = vals.slice();
  };
  radarRAF = requestAnimationFrame(step);
}

const VIEWS = [

  ["levels", "分级门槛线", "级"], ["plan", "90 天计划", "计"], ["flags", "红旗清单", "旗"],

    const i = VIEWS.findIndex(v => v[0] === state.view);

function progressOf(id) {

}
function refresh() {

  $("#sidePeek").addEventListener("click", () => setSide(true));
  $("#scrim").addEventListener("click", () => setSide(false));
  const onBreak = e => { state.side = e.matches ? "collapsed" : "open"; save(); applySide(); };
  if (MQ_SMALL.addEventListener) MQ_SMALL.addEventListener("change", onBreak);
  else if (MQ_SMALL.addListener) MQ_SMALL.addListener(onBreak);
  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === "b") { e.preventDefault(); setSide(!sideOpen()); }
    else if (k === "escape" && MQ_SMALL.matches && sideOpen()) setSide(false);
  });
}
function spyOutline() {
  const items = $$("#outline .ol-item");
  const clear = () => items.forEach(b => { b.classList.remove("current"); b.removeAttribute("aria-current"); });
  if (state.view !== "list") { clear(); return; }          // the outline only tracks the checklist view
  const cards = $$("#view-list .card");
  if (!cards.length) { clear(); return; }
  let cur = cards[0];
  for (let i = 0; i < cards.length; i++) { if (cards[i].getBoundingClientRect().top <= 150) cur = cards[i]; }
  items.forEach(b => {
    const on = b.dataset.goto === cur.id;
    b.classList.toggle("current", on);
    if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
}
function wireSpy() {
  let raf = 0;
  window.addEventListener("scroll", () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; spyOutline(); });
  }, { passive: true });
  spyOutline();
}
function init() {
  $("#kicker").textContent = "可验证行为清单 · " + DATA.cards.reduce((a, c) => a + c.blocks.length, 0) + " 个能力块";
  $("#docTitle").textContent = plain(DATA.docTitle);
  const leadTxt = DATA.usage.length ? plain(DATA.usage[0]) : "";
  $("#lead").textContent = leadTxt ? leadTxt.replace(/^用法：/, "").split("。")[0] + "。" : "";
  renderTabs(); renderOverview(); renderList(); renderScore(); renderLevels(); renderPlan(); renderFlags(); renderSources();
  renderOutline();
  const uniq = {};
  Object.keys(AGG).forEach(id => {
    if (id === "flags" || id === "all" || id.indexOf("type:") === 0) return;
    AGG[id].forEach(k => { uniq[k] = 1; });
  });
  AGG["all"] = Object.keys(uniq);
  ["门票", "基础", "溢价", "转化"].forEach(t => {
    const seen = {};
    DATA.cards.forEach(c => c.blocks.filter(b => b.type === t).forEach(b => collect(b, []).forEach(k => { seen[k] = 1; })));
    AGG["type:" + t] = Object.keys(seen);
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (!el.matches || !el.matches("input[type=checkbox][data-k]")) return;
    state.checks[el.dataset.k] = el.checked;
    const item = el.closest(".item");
    if (item) item.classList.toggle(item.classList.contains("flag") ? "hit" : "done", el.checked);
    save(); refresh();
  });
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-goto]");
    if (g && g.dataset.goto) { gotoCard(g.dataset.goto); return; }
    const gb = e.target.closest("[data-gotoblk]");
    if (gb) { gotoCard("card-" + gb.dataset.gotoblk.split(".")[0]); }
  });
  const reset = $("#resetBtn");
  if (reset) reset.addEventListener("click", () => {
    if (!window.confirm("清空本机保存的勾选与打分？")) return;
    state.checks = {}; state.scores = {}; state.acts = {}; save();
    $$("input[type=checkbox][data-k]").forEach(i => { i.checked = false; });
    $$(".item").forEach(i => i.classList.remove("done", "hit"));
    $$("[data-act]").forEach(i => { i.value = ""; });
    DATA.scoring.rows.forEach(r => renderSeg(r.k));
    refresh();
  });
  const pr = $("#printBtn"); if (pr) pr.addEventListener("click", () => window.print());
  $("#footNote").innerHTML = "源文件：<code>" + attr(SRCFILE) + "</code> · 本页由 <code>tools/build_web.py</code> 生成，勾选与打分只存在这台设备的浏览器里。";
  $("#footMeta").innerHTML = DATA.closing ? "版本 " + (DATA.sources.revisions.length ? "v2.1" : "v2") + " · " + BUILDSTAMP : "";
  $$(".item").forEach(i => i.classList.toggle(i.classList.contains("flag") ? "hit" : "done", $("input", i).checked));
  wireSidebar(); wireSpy();
  const hash = location.hash.slice(1);
  if (VIEWS.some(v => v[0] === hash)) state.view = hash;
  show(state.view || "overview", true);
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (VIEWS.some(v => v[0] === h)) show(h, true);
  });
  refresh();
}
init();

</script>
</body>
